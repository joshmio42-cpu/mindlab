[project]
name = "mindlab-workbench"
version = "0.1.0"
description = "A local, inspectable psychology procedure workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pydantic-ai-slim[openai]==2.54.0",
  "httpx2==2.13.1",
  "numpy==2.5.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.16.10"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/workbench"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
